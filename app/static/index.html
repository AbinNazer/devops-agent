<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>JARVIS</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <meta name="theme-color" content="#08111f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JARVIS">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icon-192.svg">
  <link rel="stylesheet" href="/static/app.css?v=12">
</head>
<body>
  <section id="login-screen" class="login-screen">
    <form id="login-form" class="login-card">
      <div class="login-mark">⌁</div><p class="login-eyebrow">SECURE OPS CONSOLE</p><h1>JARVIS // OPS</h1><p class="login-subtitle">Authenticate to access your infrastructure workspace.</p><label>Username<input id="login-username" autocomplete="username" required></label>
      <label>Password<input id="login-password" type="password" autocomplete="current-password" required></label>
      <button type="submit">LOGIN</button><p id="login-error" role="alert"></p>
    </form>
  </section>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">⌁</span><span>JARVIS // OPS</span></div>
      <div class="menu-wrap"><button class="icon-button" id="menu-button" aria-label="Open menu" aria-expanded="false">☰</button>
        <div id="menu" class="menu" hidden>
          <button id="clear-chat" type="button">Clear chat</button>
          <label class="menu-provider">Provider<select id="provider"></select></label>
          <button id="menu-status" type="button">Infrastructure status</button>
          <button id="menu-terminal" type="button">Open terminal</button>
          <button id="logout" type="button">Log out</button>
        </div>
      </div>
    </header>
    <section class="workspace">
      <section class="chat-panel" aria-label="Chat">
        <div id="messages" class="messages"><div class="welcome"><span class="eyebrow">DEVOPS CONSOLE</span><h1>What are we investigating?</h1><div class="quick-actions"><button type="button" data-prompt="Check infrastructure health">Check infrastructure</button><button type="button" data-prompt="Show running containers">Show containers</button><button type="button" data-prompt="Check CPU and memory usage">Check CPU / memory</button><button type="button" data-prompt="Show recent errors">Recent errors</button></div></div></div>
        <form id="chat-form" class="composer">
          <button type="button" class="plus-button" id="new-chat" aria-label="Start a new chat">＋</button>
          <textarea id="message" rows="1" placeholder="Message JARVIS..." autocomplete="off"></textarea>
          <button class="send-button" aria-label="Send message">➤</button>
        </form>
      </section>
      <section id="status-panel" class="status-panel" hidden aria-label="Infrastructure status">
        <div class="status-heading"><div><button id="back-chat" class="back-button" type="button">← Chat</button><span class="eyebrow">LIVE OVERVIEW</span><h2>Infrastructure</h2></div><button id="status-refresh" class="small-button" type="button">Refresh</button></div>
        <div class="status-grid"><article class="status-card"><span>Agent</span><strong id="stat-agent">Checking…</strong></article><article class="status-card"><span>Infrastructure</span><strong id="stat-infra">Not checked</strong></article><article class="status-card"><span>Last check</span><strong id="stat-time">—</strong></article></div>
        <p id="status-detail" class="status-detail">Open this view to run one lightweight health check.</p>
      </section>
    </section>
  </main>
  <script src="/static/app.js?v=12"></script>
</body>
</html>
